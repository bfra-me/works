name: Release

on:
  schedule:
    - cron: '0 18 * * 0' # Run every Sunday at 6 PM UTC
  workflow_dispatch:
    inputs:
      force-release:
        description: Force publish committed versions
        type: boolean
        default: false
  workflow_run:
    workflows: [Main]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manage-release:
    name: Manage Release PR
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      USE_APP_TOKEN: ${{ contains('["schedule", "workflow_run", "workflow_dispatch"]', github.event_name) }}
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - id: get-app-token
        name: Get Workflow Access Token
        if: env.USE_APP_TOKEN == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - name: Setup Git user
        if: env.USE_APP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          GIT_USER_NAME: ${{ steps.get-app-token.outputs.app-slug }}[bot]
        run: |
          USER_ID=$(gh api "/users/${GIT_USER_NAME}" --jq .id)
          git config --global user.email "${USER_ID}+${GIT_USER_NAME}@users.noreply.github.com"
          git config --global user.name "${GIT_USER_NAME}"

      - id: check-pr
        name: Check for existing release PR
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ env.USE_APP_TOKEN == 'true' && steps.get-app-token.outputs.token || secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head "changeset-release/main" \
            --json number \
            --jq '.[0].number' \
            --state open)
          if [ -n "$PR_NUMBER" ]; then
            echo "pr-exists=true" >> "$GITHUB_OUTPUT"
            echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

            MERGEABLE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')
            echo "PR $PR_NUMBER:"
            echo "- mergeable status: $MERGEABLE"
            if [ "$MERGEABLE" = "BEHIND" ] || [ "$MERGEABLE" = "UNKNOWN" ]; then
              echo "mergeable=false" >> "$GITHUB_OUTPUT"
            else
              echo "mergeable=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "pr-exists=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            MERGED_PR_NUMBER=$(gh api \
              "repos/${GH_REPO}/commits/${WORKFLOW_RUN_SHA}/pulls" \
              --jq 'map(select(.head.ref == "changeset-release/main" and .merged_at != null)) | .[0].number // empty')
            if [ -n "$MERGED_PR_NUMBER" ]; then
              echo "release-pr-merged=true" >> "$GITHUB_OUTPUT"
              echo "Release PR #$MERGED_PR_NUMBER merged in workflow run commit $WORKFLOW_RUN_SHA"
            else
              echo "release-pr-merged=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release-pr-merged=false" >> "$GITHUB_OUTPUT"
          fi
        shell: 'bash -Eeux {0}'

      - name: Checkout repository
        if: inputs.force-release == true || steps.check-pr.outputs.pr-exists == 'false' || steps.check-pr.outputs.mergeable == 'false' || (github.event_name == 'workflow_run' && steps.check-pr.outputs.pr-exists == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ env.USE_APP_TOKEN == 'true' && steps.get-app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Prepare job
        if: inputs.force-release == true || steps.check-pr.outputs.pr-exists == 'false' || steps.check-pr.outputs.mergeable == 'false' || (github.event_name == 'workflow_run' && steps.check-pr.outputs.pr-exists == 'true')
        uses: ./.github/actions/pnpm-install

      - id: check-changesets
        name: Check for uncommitted changesets
        if: |
          github.event_name == 'workflow_run' &&
          (
            steps.check-pr.outputs.pr-exists == 'true' ||
            steps.check-pr.outputs.release-pr-merged == 'true'
          )
        run: |
          # Check for pending changeset files (*.md excluding README.md)
          CHANGESET_COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$CHANGESET_COUNT" -gt 0 ]; then
            echo "has-changesets=true" >> $GITHUB_OUTPUT
            echo "Found $CHANGESET_COUNT pending changeset(s)"
          else
            echo "has-changesets=false" >> $GITHUB_OUTPUT
            echo "No pending changesets found"
          fi
        shell: 'bash -Eeux {0}'

      - name: Check NPM_TOKEN
        if: |
          inputs.force-release == true ||
          steps.check-pr.outputs.pr-exists == 'false' ||
          steps.check-pr.outputs.mergeable == 'false' ||
          (github.event_name == 'workflow_run' && steps.check-pr.outputs.pr-exists == 'true' && steps.check-changesets.outputs.has-changesets == 'true')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo '::error::The NPM_TOKEN secret is required for release operations.'
            exit 1
          fi

      - name: Configure npm authentication
        if: |
          inputs.force-release != true &&
          (
            steps.check-pr.outputs.pr-exists == 'false' ||
            steps.check-pr.outputs.mergeable == 'false' ||
            (github.event_name == 'workflow_run' && steps.check-pr.outputs.pr-exists == 'true' && steps.check-changesets.outputs.has-changesets == 'true')
          )
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"

      - name: Force publish packages to npm
        if: github.event_name == 'workflow_dispatch' && inputs.force-release == true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ env.USE_APP_TOKEN == 'true' && steps.get-app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          set +e
          pnpm publish-changesets
          PUBLISH_STATUS=$?
          set -e

          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          TAG_REFS=()
          while IFS= read -r TAG; do
            TAG_REFS+=("refs/tags/${TAG}:refs/tags/${TAG}")
          done < <(git tag -l '@bfra.me/*@*')
          if [ "${#TAG_REFS[@]}" -gt 0 ]; then
            git -c "http.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push "https://github.com/${GITHUB_REPOSITORY}.git" "${TAG_REFS[@]}"
          fi
          exit "$PUBLISH_STATUS"

      - name: Close stale release PR before force-push
        if: |
          github.event_name == 'workflow_run' &&
          steps.check-pr.outputs.pr-exists == 'true' &&
          steps.check-changesets.outputs.has-changesets == 'true'
        env:
          GH_TOKEN: ${{ env.USE_APP_TOKEN == 'true' && steps.get-app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.check-pr.outputs.pr-number }}
        run: |
          # GitHub API push mode force-pushes, which makes GitHub consider the
          # branch "recreated". GitHub then rejects PR updates with:
          # "state cannot be changed. The changeset-release/main branch was force-pushed or recreated."
          # Workaround: close the old PR and delete the branch so the action creates a fresh PR.
          echo "Closing PR #$PR_NUMBER before changesets action runs (workaround for GitHub API push mode)"
          gh pr close "$PR_NUMBER" --delete-branch || true

      - id: changesets
        name: Create Release Pull Request or Publish to npm
        if: |
          inputs.force-release != true &&
          (
            steps.check-pr.outputs.pr-exists == 'false' ||
            steps.check-pr.outputs.mergeable == 'false' ||
            (github.event_name == 'workflow_run' && steps.check-pr.outputs.pr-exists == 'true' && steps.check-changesets.outputs.has-changesets == 'true')
          )
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ env.USE_APP_TOKEN == 'true' && steps.get-app-token.outputs.token || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ env.USE_APP_TOKEN == 'true' && steps.get-app-token.outputs.token || secrets.GITHUB_TOKEN }}
          publish-script: pnpm publish-changesets
          version-script: pnpm version-changesets
          commit-message: 'chore(changesets): publish packages'
          pr-title: 'chore(🦋📦): publish packages'

      - name: Verify expected publish
        if: |
          !cancelled() &&
          github.event_name == 'workflow_run' &&
          steps.check-pr.outputs.release-pr-merged == 'true' &&
          steps.check-changesets.outputs.has-changesets == 'false'
        env:
          CHANGESETS_OUTCOME: ${{ steps.changesets.outcome }}
          CHANGESETS_PUBLISHED: ${{ steps.changesets.outputs.published }}
        run: |
          if [ "$CHANGESETS_PUBLISHED" != "true" ]; then
            echo "::error::Expected changesets/action to publish after the release PR merged, but its outcome was '$CHANGESETS_OUTCOME' and its published output was '$CHANGESETS_PUBLISHED'."
            exit 1
          fi

  trigger-org-renovate:
    if: github.repository == 'bfra-me/works' && needs.manage-release.outputs.published == 'true'
    name: Trigger Organization Renovate
    needs: manage-release
    secrets: inherit
    uses: bfra-me/.github/.github/workflows/trigger-org-renovate.yaml@b830359a19878c0dd40b92b2c8b60673e71dceac # v4.22.0
